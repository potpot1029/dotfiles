# ~/.config/starship.toml
# Synthwave prompt — matches Ghostty palette + nvim setup

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 1000

format = """
$cmd_duration\
$hostname\
$username\
$directory\
$character"""

right_format = """
$git_branch\
$git_status\
$nodejs\
$golang\
$rust\
$python\
"""

[character]
success_symbol = "[❯](bold #f222ff)"
error_symbol = "[❯](bold #fc199a)"
vicmd_symbol = "[❮](bold #36f9f6)"

[username]
style_user = "#f222ff bold italic"
style_root = "#743ad5 bold italic"
format = "[⭘ $user]($style) "
disabled = false
show_always = false

[directory]
home_symbol = " "
style = "bold #36f9f6"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = false
read_only = " "
read_only_style = "bold #fc199a"


[git_branch]
symbol = " "
style = "bold #f3e70f"
format = "[$symbol$branch]($style) "

[git_status]
style = "#ff8b39"
format = '([$all_status$ahead_behind]($style) )'
conflicted = "[=](#fc199a) "
ahead = "[UP${count}](#72f1b8) "
behind = "[DOWN${count}](#fc199a) "
diverged = "[DIV⇡${ahead_count}⇣${behind_count}](#ff8b39) "
up_to_date = ""
untracked = "[?${count}](bold #b893ce) "
stashed = "[\\$](bold #36f9f6) "
modified = "[!${count}](bold #ff8b39) "
staged = "[+${count}](bold #72f1b8) "
renamed = "[»${count}](bold #f3e70f) "
deleted = "[X${count}](bold #fc199a) "

[nodejs]
symbol = " "
style = "bold #72f1b8"
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
style = "bold #72f1b8"
format = "[$symbol($version )]($style)"

[rust]
symbol = " "
style = "bold #ff8b39"
format = "[$symbol($version )]($style)"

[python]
symbol = " "
style = "bold #72f1b8"
format = "[${symbol}${pyenv_prefix}(${version} )(\\($virtualenv\\) )]($style)"

[cmd_duration]
min_time = 2000
style = "#f3e70f"
format = "[$duration]($style) "
