set -g default-terminal "tmux-256color" 
set -ag terminal-overrides ",xterm-256color:RGB"

unbind C-b
set -g prefix C-a

set -g mouse on

# split panes
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# vim mode switching panes
# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1


bind r source-file $XDG_CONFIG_HOME/tmux/tmux.conf \; display-message "configuration reloaded."

# ── Synthwave 84 — powerline status bar ─────────────────────────

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left

set -g status-style "bg=#241b2f"

# Left: session name pill
set -g status-left-length 40
set -g status-left "#[bg=#f222ff,fg=#1a1424,bold] #{session_name} #[bg=#241b2f,fg=#f222ff]\ue0b0"

# Windows (tabs)
set -g window-status-format          "#[fg=#848bbd,bg=#241b2f] #I #W "
set -g window-status-current-format  "#[fg=#36f9f6,bg=#2e2a4f,bold] #I #[fg=#e8d6f0]#W "
set -g window-status-separator       ""

# Right: path + date + time
set -g status-right-length 80
set -g status-right "#[fg=#2e2a4f,bg=#241b2f]\ue0b2#[fg=#72f1b8,bg=#2e2a4f] #{b:pane_current_path} #[fg=#262335,bg=#2e2a4f]\ue0b2#[fg=#848bbd,bg=#262335] %a %d %b #[fg=#1a1424,bg=#262335]\ue0b2#[fg=#36f9f6,bg=#1a1424] %H:%M "

# Pane borders
set -g pane-border-style        "fg=#2e2a4f"
set -g pane-active-border-style "fg=#f222ff"

# Message / command bar
set -g message-style         "bg=#fede5d,fg=#1a1424,bold"
set -g message-command-style "bg=#36f9f6,fg=#1a1424,bold"

# Copy mode selection
set -g mode-style "bg=#463465,fg=#e8d6f0"
