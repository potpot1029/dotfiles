set -g default-terminal "tmux-256color"

unbind C-b
set -g prefix C-a
bind C-a send-prefix # C-a C-a sends a literal C-a

set -g mouse on

set -g base-index 1 # start windows numbering at 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g allow-passthrough on
set -g visual-activity off

set-option -g focus-events on

# split panes
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# smart pane switching with awareness of vim splits, see https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'
bind C-l send-keys 'C-l' # prefix C-l clears the screen

# copy mode
set -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# plugins
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

bind r source-file ~/.config/tmux/tmux.conf \; display-message "configuration reloaded."

# ── Synthwave 84 — minimal status bar ──────────────────────────

# >>> palette (generated)
# generated by ~/.config/palette/generate.py from palette.toml; do not edit
%hidden BG="#1a1424"
%hidden BG_DARK="#161925"
%hidden BG_ALT="#241b2f"
%hidden SURFACE="#2e2a4f"
%hidden SELECTION="#3d2e52"
%hidden SELECTION_ALT="#463465"
%hidden BLACK="#1a1a1a"
%hidden GRAY="#444444"
%hidden FG="#a2c7e5"
%hidden FG_MUTED="#848bbd"
%hidden MAGENTA="#f222ff"
%hidden PURPLE="#743ad5"
%hidden PINK="#fc199a"
%hidden PINK_LIGHT="#ff79c6"
%hidden ROSE="#ff7edb"
%hidden RED="#fe4450"
%hidden CYAN="#36f9f6"
%hidden BLUE="#6e8bff"
%hidden GREEN="#72f1b8"
%hidden YELLOW="#fede5d"
%hidden YELLOW_WARM="#ffd318"
%hidden YELLOW_BRIGHT="#f3e70f"
%hidden ORANGE="#ff8b39"
%hidden LAVENDER="#b893ce"
%hidden AMBER="#cc8822"
%hidden CRIMSON="#cc2222"
%hidden BRIGHT_RED="#ff6b78"
%hidden BRIGHT_GREEN="#9bf5ce"
%hidden BRIGHT_YELLOW="#fff099"
%hidden BRIGHT_BLUE="#9db0ff"
%hidden BRIGHT_MAGENTA="#ffaae6"
%hidden BRIGHT_CYAN="#7afaf8"
%hidden BRIGHT_WHITE="#fbf9ff"
# <<< palette

# use the terminal (ghostty) ANSI palette for menus, popups, pickers and search highlights
set -g theme terminal

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left

set -g status-style "bg=$BG_ALT,fg=$FG_MUTED"

# left: session name (turns yellow while the prefix is held)
set -g status-left-length 40
set -g status-left "#{?client_prefix,#[fg=$YELLOW],#[fg=$MAGENTA]}#[bold] #{session_name}  "

# windows: dim when inactive, cyan when current; Z marks a zoomed pane
set -g window-status-format          " #I #W "
set -g window-status-current-format  "#[fg=$CYAN,bold] #I #W#{?window_zoomed_flag, Z,} "
set -g window-status-separator       ""

# right: current directory + time
set -g status-right-length 60
set -g status-right "#[fg=$FG_MUTED]#{b:pane_current_path}  #[fg=$GREEN]%H:%M "

# pane borders
set -g pane-border-style        "fg=$SURFACE"
set -g pane-active-border-style "fg=$MAGENTA"

# message / command bar
set -g message-style         "bg=$YELLOW,fg=$BG,bold"
set -g message-command-style "bg=$CYAN,fg=$BG,bold"

# copy mode selection
set -g mode-style "bg=$SELECTION_ALT,fg=$FG"

# tpm
run '~/.tmux/plugins/tpm/tpm'

