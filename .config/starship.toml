# Synthwave prompt, colours from the generated palette below

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 1000
palette = "synthwave"

format = """
$cmd_duration\
$hostname\
$username\
$directory\
$character"""

right_format = """
$git_branch\
$git_status\
$nodejs\
$golang\
$rust\
$python\
"""

[character]
success_symbol = "[❯](bold magenta)"
error_symbol = "[❯](bold pink)"
vicmd_symbol = "[❮](bold cyan)"

[username]
style_user = "magenta bold italic"
style_root = "purple bold italic"
format = "[⭘ $user]($style) "

[directory]
home_symbol = " "
style = "bold cyan"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = false
read_only = " "
read_only_style = "bold pink"

[git_branch]
symbol = " "
style = "bold yellow_bright"
format = "[$symbol$branch]($style) "

[git_status]
style = "orange"
format = '([$all_status$ahead_behind]($style) )'
conflicted = "[=](pink) "
ahead = "[UP${count}](green) "
behind = "[DOWN${count}](pink) "
diverged = "[DIV⇡${ahead_count}⇣${behind_count}](orange) "
up_to_date = ""
untracked = "[?${count}](bold lavender) "
stashed = "[\\$](bold cyan) "
modified = "[!${count}](bold orange) "
staged = "[+${count}](bold green) "
renamed = "[»${count}](bold yellow_bright) "
deleted = "[X${count}](bold pink) "

[nodejs]
symbol = " "
style = "bold green"
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
style = "bold green"
format = "[$symbol($version )]($style)"

[rust]
symbol = " "
style = "bold orange"
format = "[$symbol($version )]($style)"

[python]
symbol = " "
style = "bold green"
format = "[${symbol}${pyenv_prefix}(${version} )(\\($virtualenv\\) )]($style)"

[cmd_duration]
min_time = 2000
style = "yellow_bright"
format = "[$duration]($style) "

