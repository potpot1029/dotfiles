# palette variables ($magenta, $bg_dark, ...), generated from ~/.config/palette
source = ~/.config/hypr/colors.conf

general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = $WALLPAPER_PATH
    blur_passes = 2
    blur_size = 2
}

input-field {
    monitor = HDMI-A-1
    size = 200, 50
    outline_thickness = 1
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    outer_color = $purple
    inner_color = $bg_dark
    font_color = $magenta
    fade_on_empty = false
    placeholder_text = Input password...
    rounding = 0
    check_color = $amber
    fail_color = $crimson
    fail_text = Access denied <b>($ATTEMPTS)</b>
    fail_transition = 300
    position = 0, -520
    halign = center
    valign = center
}
